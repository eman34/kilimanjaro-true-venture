summary: >-
  Escape the crowds at one of Tanzania's hidden treasures, Mkomazi National
  Park. Known for its peaceful wilderness, scenery, black rhino conservation
  project and rare African wild dogs, Mkomazi is a safari for travelers
  looking for somewhere less crowded. On clear days it offers views toward
  Mount Kilimanjaro.
