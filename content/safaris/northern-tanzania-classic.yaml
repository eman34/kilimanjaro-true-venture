summary: >-
  The legendary northern safari circuit in one journey. It combines the
  elephant-filled landscapes of Tarangire National Park, the endless wildlife
  plains of the Serengeti and the spectacular Ngorongoro Crater. Expect game
  drives, African sunsets, mid-range or luxury lodges and wildlife including
  lions, elephants, giraffes, zebras and cheetahs. Ideal for travelers looking
  for the complete Tanzania wildlife experience.
